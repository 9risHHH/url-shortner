<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: #f0f2f5;
        }
        .container {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 500px;
            max-width: 94%;
        }
        h1 {
            margin-top: 0;
            color: #1e293b;
        }
        p {
            color: #475569;
        }
        input {
            width: 80%;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 40px;
            font-size: 16px;
            outline: none;
            transition: 0.2s;
        }
        input:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 3px rgba(40, 167, 69, 0.2);
        }
        button {
            padding: 12px 28px;
            background: #28a745;
            color: #fff;
            border: none;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            margin-top: 12px;
        }
        button:hover {
            background: #1e7e34;
            transform: scale(1.02);
        }
        #result {
            margin-top: 24px;
            padding: 16px;
            border-radius: 12px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            min-height: 60px;
            word-break: break-all;
            font-size: 15px;
        }
        .error {
            color: #dc3545;
        }
        .success {
            color: #28a745;
        }
        a {
            color: #2563eb;
            text-decoration: none;
            font-weight: 500;
        }
        a:hover {
            text-decoration: underline;
        }
        .copy-btn {
            margin-top: 10px;
            background: #e2e8f0;
            color: #1e293b;
            padding: 6px 16px;
            font-size: 13px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.2s;
        }
        .copy-btn:hover {
            background: #cbd5e1;
        }
        .flex {
            display: flex;
            gap: 8px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔗 URL Shortener</h1>
    <p>Введите длинную ссылку и получите короткую</p>

    <div class="flex">
        <input type="url" id="urlInput" placeholder="https://example.com" />
        <button id="shortenBtn">Сократить</button>
    </div>

    <div id="result">📌 Здесь появится результат</div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const button = document.getElementById('shortenBtn');
        const input = document.getElementById('urlInput');
        const result = document.getElementById('result');

        button.addEventListener('click', function () {
            const url = input.value.trim();

            if (!url) {
                result.innerHTML = '<span class="error">❌ Введите ссылку!</span>';
                return;
            }

            if (!url.startsWith('http://') && !url.startsWith('https://')) {
                result.innerHTML = '<span class="error">❌ Ссылка должна начинаться с http:// или https://</span>';
                return;
            }

            result.innerHTML = '⏳ Отправка...';

            fetch('/shorten', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            })
                .then(async (response) => {
                    if (!response.ok) {
                        const text = await response.text();
                        throw new Error(text || 'Ошибка сервера');
                    }
                    return response.json();
                })
                .then((data) => {
                    const short = data.short_url;
                    if (!short) throw new Error('Не получен короткий URL');

                    const fullShort = `http://localhost:8080/${short}`;

                    result.innerHTML = `
                        <span class="success">✅ Готово!</span><br />
                        Короткая ссылка:<br />
                        <a href="${fullShort}" target="_blank">${fullShort}</a>
                        <br />
                        <button class="copy-btn" onclick="navigator.clipboard.writeText('${fullShort}')">
                            📋 Копировать
                        </button>
                    `;
                })
                .catch((err) => {
                    result.innerHTML = `<span class="error">❌ Ошибка: ${err.message}</span>`;
                });
        });
    });
</script>

</body>
</html>
